# Build the Spark job image and push it to Harbor.
#
#   git tag spark-v0.2.0 && git push origin spark-v0.2.0
#     -> harbor.nopega.net/ice-berg-platform/datapipeline:0.2.0
#   push to main that touches images/spark/**
#     -> build only, nothing pushed (catches a broken Dockerfile early)
#   Actions tab -> "Run workflow"
#     -> build only, same as above
#
# Runs on the self-hosted runners in our own cluster (VPN_DATA_PLATFORM
# terraform/11_ci): Harbor is reachable only from inside the VPC.
#
# No pull_request trigger, on purpose. These runners sit inside the VPC in a
# privileged container; a pull request from a fork would run its own code
# there. Only people who can push to this repository can start a job.
#
# Then use the new tag: image_tag in dags/nyc_taxi_medallion.py (or the
# trigger config), and runs/smoke-test.yaml.
name: spark-image

on:
  push:
    tags: ["spark-v*"]
    branches: [main]
    paths: ["images/spark/**", ".github/workflows/spark-image.yml"]
  workflow_dispatch:

concurrency:
  group: spark-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: harbor.nopega.net/ice-berg-platform/datapipeline

jobs:
  build:
    runs-on: vpn-data-platform
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Tag
        id: tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/spark-v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/spark-v}" >> "$GITHUB_OUTPUT"
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Harbor
        if: steps.tag.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: harbor.nopega.net
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Build${{ steps.tag.outputs.push == 'true' && ' and push' || '' }} ${{ env.IMAGE }}:${{ steps.tag.outputs.version }}
        uses: docker/build-push-action@v6
        with:
          context: images/spark
          platforms: linux/amd64
          push: ${{ steps.tag.outputs.push == 'true' }}
          tags: ${{ env.IMAGE }}:${{ steps.tag.outputs.version }}
          provenance: false
