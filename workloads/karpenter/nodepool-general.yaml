# On-demand overflow for the platform: when the managed node is full, pods
# that ask for workload=critical (Polaris, Trino, Argo CD, Airflow, Spark
# drivers) land on nodes from here.
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: general
spec:
  template:
    metadata:
      labels:
        # The same label the managed node group carries, so existing
        # nodeSelectors are satisfied by either.
        workload: critical
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]          # the Spark/pipeline images are amd64
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: ["c", "m", "r"]
        - key: karpenter.k8s.aws/instance-generation
          operator: Gt
          values: ["5"]
        - key: karpenter.k8s.aws/instance-cpu
          operator: In
          values: ["2", "4", "8"]
      expireAfter: 720h              # replace nodes monthly: fresh AMI, no long-lived drift

  # Hard ceiling on what this pool may add, on top of the managed node.
  # 16 vCPU / 64 GiB is roughly two m6i.2xlarge -- a cost guard, not a target.
  limits:
    cpu: "16"
    memory: 64Gi

  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 5m
    # At most one node replaced at a time.
    budgets:
      - nodes: "1"
